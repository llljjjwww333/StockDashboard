<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1a1a2e;
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background-color: #16213e;
        }
        .error {
            background-color: #e74c3c;
        }
        .success {
            background-color: #2ecc71;
        }
        .info {
            background-color: #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebSocket Test</h1>
        <div id="messages"></div>
        <button onclick="connectWebSocket()">Connect</button>
        <button onclick="disconnectWebSocket()">Disconnect</button>
        <button onclick="subscribeToStock('AAPL')">Subscribe to AAPL</button>
        <button onclick="unsubscribeFromStock('AAPL')">Unsubscribe from AAPL</button>
    </div>

    <script>
        let socket = null;

        function addMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connectWebSocket() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                addMessage('WebSocket is already connected');
                return;
            }

            try {
                socket = new WebSocket('ws://localhost:8000/ws/stock-updates');

                socket.onopen = () => {
                    addMessage('WebSocket connected', 'success');
                };

                socket.onmessage = (event) => {
                    try {
                        const message = JSON.parse(event.data);
                        addMessage(`Received: ${JSON.stringify(message)}`);
                    } catch (error) {
                        addMessage(`Error parsing message: ${error}`, 'error');
                    }
                };

                socket.onerror = (error) => {
                    addMessage(`WebSocket error: ${error}`, 'error');
                };

                socket.onclose = () => {
                    addMessage('WebSocket disconnected', 'info');
                };
            } catch (error) {
                addMessage(`Error connecting to WebSocket: ${error}`, 'error');
            }
        }

        function disconnectWebSocket() {
            if (socket) {
                socket.close();
                socket = null;
                addMessage('Disconnected from WebSocket', 'info');
            } else {
                addMessage('WebSocket is not connected', 'info');
            }
        }

        function subscribeToStock(ticker) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'subscribe',
                    data: { ticker }
                }));
                addMessage(`Subscribed to ${ticker}`, 'success');
            } else {
                addMessage('WebSocket is not connected', 'error');
            }
        }

        function unsubscribeFromStock(ticker) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    type: 'unsubscribe',
                    data: { ticker }
                }));
                addMessage(`Unsubscribed from ${ticker}`, 'success');
            } else {
                addMessage('WebSocket is not connected', 'error');
            }
        }

        // Connect on page load
        window.onload = connectWebSocket;
    </script>
</body>
</html>
